name: repro

on:
  push:
  workflow_dispatch:

jobs:
  repro:
    name: ${{ matrix.os }} / workerd ${{ matrix.workerd }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        workerd: [1.20261110.1, 1.20261112.1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-audit --no-fund workerd@${{ matrix.workerd }}
      - run: node repro.mjs
